[project]
name = "lekha"
version = "0.1.0"
description = "Lekha: secure, grounded enterprise knowledge platform (modular monolith)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # HTTP API framework and ASGI server.
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Validated configuration from environment variables / .env.
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # ORM + migrations. asyncpg is the single PostgreSQL driver for the app and Alembic
    # (psycopg's async mode cannot run on Windows' default Proactor event loop).
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    # Redis client (readiness now; ARQ job queue in Phase 2).
    "redis>=5.2,<7.0",
    # HTTP client for Qdrant / object-storage health probes and future integrations.
    "httpx>=0.28,<1.0",
    # Structured JSON logging with request-scoped context.
    "structlog>=24.4,<26.0",
    "boto3>=1.35,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "arq>=0.26,<1.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    # Interim real embedder (all-MiniLM-L6-v2) runs in numpy with the HF tokenizer,
    # avoiding PyTorch until BGE-M3 is approved (model_layer/minilm.py).
    "numpy>=2.4,<3.0",
    "tokenizers>=0.22,<1.0",
    "onnxruntime>=1.20,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    # Enforces the module dependency rules from CLAUDE.md section 4.3.
    "import-linter>=2.1,<3.0",
    "httpx2>=2.13,<3.0",  # required by starlette.testclient (FastAPI TestClient)
    "boto3-stubs[s3]>=1.35,<2.0",
]

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lekha", "apps", "db", "model_layer"]

[tool.uv]
# Supply-chain guard: never resolve packages published in the last ~2 weeks.
# Bump this date deliberately when upgrading dependencies.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Generated migrations embed long SQL check-constraint expressions verbatim.
"db/migrations/versions/**" = ["E501"]
# The golden set is a table of hand-written facts; one policy or question per line reads best.
"tests/eval/golden.py" = ["E501"]
"apps/scripts/demo_corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["lekha", "apps", "db", "model_layer", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "onnxruntime.*"]  # these ship no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["db.migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the local Docker Compose stack (run via ./dev.ps1 test-integration)",
]
addopts = "-ra --strict-markers -m 'not integration'"
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["lekha", "apps", "db", "model_layer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Business modules never import application entry points"
type = "forbidden"
source_modules = ["lekha", "db"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "Core infrastructure does not import the database layer"
type = "forbidden"
source_modules = ["lekha.core"]
forbidden_modules = ["db"]

[[tool.importlinter.contracts]]
name = "Permission and audit domain stay free of frameworks and persistence (CLAUDE.md 4.2)"
type = "forbidden"
source_modules = ["lekha.auth", "lekha.audit"]
forbidden_modules = ["db", "apps", "sqlalchemy", "fastapi", "starlette", "asyncpg", "redis", "httpx"]

[[tool.importlinter.contracts]]
name = "Upload validation and storage interface stay pure (no S3 SDK, DB or web framework)"
type = "forbidden"
source_modules = ["lekha.memory.files", "lekha.memory.storage", "lekha.memory.glossary"]
forbidden_modules = ["db", "apps", "sqlalchemy", "fastapi", "starlette", "boto3", "botocore"]

[[tool.importlinter.contracts]]
name = "Model layer depends on nothing in Lekha (CLAUDE.md 4.3)"
type = "forbidden"
source_modules = ["model_layer"]
forbidden_modules = ["lekha", "apps", "db"]

[[tool.importlinter.contracts]]
name = "Ingestion and retrieval logic never import entry points or the database layer"
type = "forbidden"
source_modules = ["lekha.ingestion", "lekha.retrieval"]
forbidden_modules = ["apps", "db", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "Answer generation is pure: no database, web framework, network client or model vendor"
type = "forbidden"
source_modules = ["lekha.generation"]
forbidden_modules = ["apps", "db", "model_layer", "sqlalchemy", "fastapi", "starlette", "httpx", "boto3", "botocore"]

